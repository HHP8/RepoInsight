name: Bug report
description: Report a reproducible RepoInsight defect
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove credentials and private repository data before submitting.
  - type: input
    id: version
    attributes:
      label: RepoInsight version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
