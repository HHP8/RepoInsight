name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src tests tools benchmarks
      - run: python -m pytest -q
      - name: Verify tag and package version
        run: python -c "import os, tomllib; tag=os.environ['GITHUB_REF_NAME']; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert tag == f'v{version}', (tag, version)"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
