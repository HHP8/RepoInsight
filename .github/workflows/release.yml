name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . --group dev
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src tests tools benchmarks
      - run: python -m pytest -q
      - name: Verify tag and package version
        run: python -c "import os, tomllib; tag=os.environ['GITHUB_REF_NAME']; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert tag == f'v{version}', (tag, version)"
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'v') &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify manual publication ref and package version
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in v*) ;; *) exit 1 ;; esac
          git fetch --force --no-tags origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git rev-parse --verify "refs/tags/$GITHUB_REF_NAME^{commit}"
          python -c "import os, tomllib; tag=os.environ['GITHUB_REF_NAME']; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert tag == f'v{version}', (tag, version)"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
